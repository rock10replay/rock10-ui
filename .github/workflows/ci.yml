name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install --legacy-peer-deps

    - name: Run Linter
      run: npm run lint
      # Continue even if there are lint warnings/errors to run tests
      continue-on-error: true

    - name: Install Playwright Browsers (for Storybook/Vitest integration)
      run: npx playwright install chromium --with-deps

    - name: Run Tests (Unit & Storybook)
      run: npm run test

    - name: Build Package
      run: npm run build
